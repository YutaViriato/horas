<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>relógio da vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --text: #1c1712;
    --muted: #6b6153;
    --line: rgba(28,23,18,0.22);
    --picker-invert: 0;
  }

  *{ box-sizing: border-box; }

  html, body{ margin:0; padding:0; min-height:100dvh; }

  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dfe3e6;
    color: var(--text);
    padding: 8vh 7vw;
    font-family: 'Cormorant Garamond', serif;
    overflow:hidden;
  }

  .sky-layer{
    position:fixed;
    inset:0;
    z-index:-3;
    opacity:0;
    transition: opacity 1.25s ease;
    background-image: linear-gradient(to top, #dfe3e6 0%, #cdd6de 25%, #b9c6d1 100%);
  }
  #sky-a{ opacity:1; }

  #stars{
    position:fixed;
    inset:0;
    z-index:-2;
    opacity:0;
    transition: opacity 1.1s ease;
    overflow:hidden;
    pointer-events:none;
  }

  .star{
    position:absolute;
    border-radius:50%;
    background:#ffffff;
    animation: twinkle 5s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%, 100% { opacity: var(--base-opacity); }
    50%      { opacity: calc(var(--base-opacity) * 0.3); }
  }

  .celestial-body{
    position:fixed;
    top:50%; left:50%;
    border-radius:50%;
    opacity:0;
    transform: translate(-50%, -50%);
    transition: top 1.3s ease, left 1.3s ease, opacity 1.3s ease,
                background-color 1.3s ease, box-shadow 1.3s ease;
    z-index:-2;
    pointer-events:none;
  }
  .celestial-body.sun{  width: clamp(46px, 9vw, 72px); height: clamp(46px, 9vw, 72px); }
  .celestial-body.moon{ width: clamp(30px, 6vw, 46px); height: clamp(30px, 6vw, 46px); }

  .scrim{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.15s ease;
  }
  .scrim-light{
    background: radial-gradient(ellipse 62vw 66vh at 50% 48%, rgba(255,255,255,0.65), rgba(255,255,255,0) 68%);
  }
  .scrim-dark{
    background: radial-gradient(ellipse 62vw 66vh at 50% 48%, rgba(0,0,0,0.55), rgba(0,0,0,0) 68%);
  }

  .container{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 440px;
    text-align:center;
    animation: rise 1.6s ease both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform:none; }
  }

  .clock{
    font-weight: 400;
    font-size: clamp(4rem, 17vw, 8rem);
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    transition: color 1.15s ease;
    margin: 0;
  }

  .age-readout{
    font-family:'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0.9rem 0 0;
    min-height: 1em;
    transition: color 1.15s ease;
  }

  .horizon{
    width: 46px;
    height: 1px;
    background: var(--line);
    margin: 1.6rem auto;
    transition: background-color 1.15s ease;
  }

  .phrase{
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    color: var(--muted);
    min-height: 2.6em;
    margin: 0 0 4rem;
    transition: color 1.15s ease;
  }

  .inputs{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 1.8rem;
  }

  .field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 0.55rem;
    width: min(200px, 74vw);
  }

  .field.field-birth{ width: min(270px, 88vw); }

  .field span{
    font-family:'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 1.15s ease;
  }

  .birth-row{
    display:flex;
    align-items:stretch;
    gap: 0.6rem;
    width: 100%;
  }

  input[type="date"],
  input[type="number"]{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    text-align:center;
    padding: 0.35rem 0;
    outline: none;
    transition: color 1.15s ease, border-color 0.3s ease;
    -moz-appearance: textfield;
  }

  .birth-row input[type="date"]{ flex: 1; min-width: 0; }

  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  input[type="date"]::-webkit-calendar-picker-indicator{
    filter: invert(var(--picker-invert));
    opacity: 0.7;
    cursor: pointer;
  }

  input:focus-visible{ border-color: var(--text); outline:none; }

  .toggle{
    background:none;
    border:none;
    padding: 0.2rem 0;
    font-family:'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--line);
    transition: color 1.15s ease, opacity 0.4s ease;
  }

  .toggle:hover{ color: var(--text); }
  .toggle:disabled{ opacity: 0.3; pointer-events: none; }

  .step-btn{
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 0.75rem;
    cursor: pointer;
    transition: color 1.15s ease, border-color 0.3s ease, opacity 0.4s ease;
  }

  .step-btn:hover:not(:disabled){ border-color: var(--text); }
  .step-btn:disabled{ opacity: 0.3; pointer-events: none; }

  #expectancy-wrap{
    overflow:hidden;
    max-height:0;
    opacity:0;
    margin-top:0;
    transition: max-height 0.5s ease, opacity 0.4s ease, margin-top 0.5s ease;
  }

  #expectancy-wrap.visible{
    max-height: 100px;
    opacity:1;
    margin-top: 0.4rem;
  }

  input:focus-visible, button:focus-visible{
    outline: 1px solid var(--text);
    outline-offset: 5px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

</style>
</head>
<body id="body">

  <div class="sky-layer" id="sky-a"></div>
  <div class="sky-layer" id="sky-b"></div>
  <div id="stars"></div>
  <div class="celestial-body sun" id="celestial"></div>
  <div class="scrim scrim-light" id="scrim-light"></div>
  <div class="scrim scrim-dark" id="scrim-dark"></div>

  <div class="container">

    <div class="clock" id="time">&#8211;&#8211;:&#8211;&#8211;</div>
    <p class="age-readout" id="age-readout"></p>
    <div class="horizon"></div>
    <p class="phrase" id="phrase">Primeiro, uma data.</p>

    <div class="inputs">
      <label class="field field-birth">
        <span>nascimento</span>
        <div class="birth-row">
          <input type="date" id="birthdate" />
          <button class="step-btn" id="advance-btn" type="button" disabled>+1h</button>
        </div>
      </label>

      <button class="toggle" id="toggle-btn" type="button">ajustar expectativa de vida</button>

      <label class="field" id="expectancy-wrap">
        <span>expectativa (anos)</span>
        <input type="number" id="expectancy" inputmode="decimal" step="any" min="1" max="130" value="80" />
      </label>
    </div>

  </div>

<script>
(function(){

  var birthInput = document.getElementById('birthdate');
  var expectancyInput = document.getElementById('expectancy');
  var timeEl = document.getElementById('time');
  var ageEl = document.getElementById('age-readout');
  var phraseEl = document.getElementById('phrase');
  var toggleBtn = document.getElementById('toggle-btn');
  var expectancyWrap = document.getElementById('expectancy-wrap');
  var advanceBtn = document.getElementById('advance-btn');
  var root = document.documentElement;
  var skyA = document.getElementById('sky-a');
  var skyB = document.getElementById('sky-b');
  var starsEl = document.getElementById('stars');
  var celestialEl = document.getElementById('celestial');
  var scrimLightEl = document.getElementById('scrim-light');
  var scrimDarkEl = document.getElementById('scrim-dark');
  var currentSky = 'a';
  var steppedHour = null; // null = showing the real, current moment
  var birthDebounce = null;

  var todayISO = new Date().toISOString().split('T')[0];
  birthInput.max = todayISO;
  birthInput.min = '1900-01-01';

  toggleBtn.addEventListener('click', function(){
    expectancyWrap.classList.toggle('visible');
  });

  // ---------- color helpers ----------

  function hexToRgb(hex){
    hex = hex.replace('#', '');
    return [
      parseInt(hex.substring(0,2), 16),
      parseInt(hex.substring(2,4), 16),
      parseInt(hex.substring(4,6), 16)
    ];
  }

  function lerp(a, b, t){ return a + (b - a) * t; }

  function lerpRgb(c0, c1, t){
    return [
      Math.round(lerp(c0[0], c1[0], t)),
      Math.round(lerp(c0[1], c1[1], t)),
      Math.round(lerp(c0[2], c1[2], t))
    ];
  }

  function rgbCss(rgb){ return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')'; }

  function brightness(rgb){
    return (rgb[0]*299 + rgb[1]*587 + rgb[2]*114) / 1000;
  }

  // ---------- sky control points ----------

  var raw = [
    [0,    '#0a0f1e', '#06091a', '#030408'],
    [5,    '#2a2144', '#1c1a3a', '#0a0b1c'],
    [6.5,  '#7a5470', '#4a4470', '#202c52'],
    [7.5,  '#f2a765', '#a488a8', '#34558c'],
    [9,    '#cfe6f0', '#8fc4e6', '#3f76b0'],
    [12,   '#eef6fb', '#a9d6f2', '#4a8dc8'],
    [15,   '#e9dcb0', '#9fc0dd', '#4a7cae'],
    [17.5, '#e8935a', '#8a86a8', '#2f4a78'],
    [19,   '#a8506a', '#5a3f68', '#161638'],
    [21,   '#241f3d', '#161430', '#07070f'],
    [24,   '#0a0f1e', '#06091a', '#030408']
  ];

  var stops = raw.map(function(row){
    return { h: row[0], horizon: hexToRgb(row[1]), mid: hexToRgb(row[2]), zenith: hexToRgb(row[3]) };
  });

  function skyAt(hour){
    for(var i = 0; i < stops.length - 1; i++){
      var s0 = stops[i], s1 = stops[i+1];
      if(hour >= s0.h && hour <= s1.h){
        var t = (s1.h === s0.h) ? 0 : (hour - s0.h) / (s1.h - s0.h);
        return {
          horizon: lerpRgb(s0.horizon, s1.horizon, t),
          mid:     lerpRgb(s0.mid,     s1.mid,     t),
          zenith:  lerpRgb(s0.zenith,  s1.zenith,  t)
        };
      }
    }
    var last = stops[stops.length - 1];
    return { horizon: last.horizon, mid: last.mid, zenith: last.zenith };
  }

  function setSky(sky){
    var css = 'linear-gradient(to top, ' +
      rgbCss(sky.horizon) + ' 0%, ' +
      rgbCss(sky.mid) + ' 28%, ' +
      rgbCss(sky.zenith) + ' 100%)';

    var incoming = currentSky === 'a' ? skyB : skyA;
    var outgoing = currentSky === 'a' ? skyA : skyB;
    incoming.style.backgroundImage = css;
    incoming.style.opacity = '1';
    outgoing.style.opacity = '0';
    currentSky = currentSky === 'a' ? 'b' : 'a';
  }

  // ---------- sun / moon arc ----------

  var SUN_START = 6.5, SUN_END = 19;
  var MOON_START = 19, MOON_END = 30.5;

  function celestialFor(hour){
    var isSun, t;
    if(hour >= SUN_START && hour <= SUN_END){
      isSun = true;
      t = (hour - SUN_START) / (SUN_END - SUN_START);
    } else {
      isSun = false;
      var h = hour < SUN_START ? hour + 24 : hour;
      t = (h - MOON_START) / (MOON_END - MOON_START);
    }
    var arc = Math.sin(Math.PI * Math.max(0, Math.min(1, t)));
    return {
      isSun: isSun,
      top: 84 - arc * 68,
      left: 16 + t * 68,
      opacity: Math.min(1, arc * 3.2),
      arc: arc
    };
  }

  var SUN_LOW = [255, 138, 74];
  var SUN_HIGH = [255, 246, 214];
  var MOON_LOW = [150, 160, 190];
  var MOON_HIGH = [232, 236, 248];

  function applyCelestial(hour){
    var c = celestialFor(hour);
    celestialEl.style.top = c.top + '%';
    celestialEl.style.left = c.left + '%';
    celestialEl.style.opacity = c.opacity.toFixed(2);

    if(c.isSun){
      celestialEl.classList.add('sun');
      celestialEl.classList.remove('moon');
      var sc = lerpRgb(SUN_LOW, SUN_HIGH, c.arc);
      celestialEl.style.backgroundColor = rgbCss(sc);
      celestialEl.style.boxShadow = '0 0 42px 14px rgba(' + sc[0] + ',' + sc[1] + ',' + sc[2] + ',0.45)';
    } else {
      celestialEl.classList.add('moon');
      celestialEl.classList.remove('sun');
      var mc = lerpRgb(MOON_LOW, MOON_HIGH, c.arc);
      celestialEl.style.backgroundColor = rgbCss(mc);
      celestialEl.style.boxShadow = '0 0 26px 6px rgba(' + mc[0] + ',' + mc[1] + ',' + mc[2] + ',0.3)';
    }
  }

  // ---------- stars ----------

  var STAR_COUNT = 90;
  (function buildStars(){
    for(var i = 0; i < STAR_COUNT; i++){
      var star = document.createElement('div');
      star.className = 'star';
      star.style.top = (Math.pow(Math.random(), 1.3) * 82) + '%';
      star.style.left = (Math.random() * 100) + '%';
      var size = (Math.random() * 1.6 + 0.6).toFixed(2);
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      var baseOp = (Math.random() * 0.5 + 0.5).toFixed(2);
      star.style.setProperty('--base-opacity', baseOp);
      star.style.animationDelay = (Math.random() * 6).toFixed(2) + 's';
      star.style.animationDuration = (4 + Math.random() * 4).toFixed(2) + 's';
      starsEl.appendChild(star);
    }
  })();

  function starsOpacityFor(zenithRgb){
    var b = brightness(zenithRgb);
    var norm = (b - 6) / (150 - 6);
    norm = Math.max(0, Math.min(1, norm));
    return Math.pow(1 - norm, 1.7);
  }

  // ---------- palette / text contrast ----------

  function applyReading(midRgb){
    if(brightness(midRgb) > 150){
      root.style.setProperty('--text', '#1c1712');
      root.style.setProperty('--muted', '#6b6153');
      root.style.setProperty('--line', 'rgba(28,23,18,0.22)');
      root.style.setProperty('--picker-invert', '0');
      scrimLightEl.style.opacity = '1';
      scrimDarkEl.style.opacity = '0';
    } else {
      root.style.setProperty('--text', '#f5f1e8');
      root.style.setProperty('--muted', '#c9c2b4');
      root.style.setProperty('--line', 'rgba(245,241,232,0.22)');
      root.style.setProperty('--picker-invert', '1');
      scrimLightEl.style.opacity = '0';
      scrimDarkEl.style.opacity = '1';
    }
  }

  var IDLE_SKY = {
    horizon: hexToRgb('#dfe3e6'),
    mid: hexToRgb('#cdd6de'),
    zenith: hexToRgb('#b9c6d1')
  };

  function showIdle(message){
    timeEl.innerHTML = '&#8211;&#8211;:&#8211;&#8211;';
    ageEl.textContent = '';
    phraseEl.textContent = message;
    setSky(IDLE_SKY);
    applyReading(IDLE_SKY.mid);
    starsEl.style.opacity = '0';
    celestialEl.style.opacity = '0';
  }

  // ---------- life-stage phrases ----------

  function phraseFor(hour){
    if(hour < 5)  return 'Grande parte de quem você é ainda está sendo decidida por outros.';
    if(hour < 7)  return 'Agora as escolhas começam a ser suas. O peso, também.';
    if(hour < 12) return 'Ainda parece possível recomeçar do zero, se precisar.';
    if(hour < 14) return 'O sol está a pino. Não sobra sombra para esconder nada.';
    if(hour < 18) return 'As pessoas que cuidavam de você começam a precisar de cuidado.';
    if(hour < 20) return 'O trabalho começa a perguntar por que ainda está sendo feito.';
    if(hour < 23) return 'A memória passa a abrigar mais gente do que o mundo.';
    return 'Está tudo dito, menos a última frase.';
  }

  var OVERFLOW_PHRASE = 'Estatisticamente, isso já não deveria estar acontecendo.';

  function formatAge(age){
    return age.toFixed(1).replace('.', ',') + ' anos';
  }

  // ---------- shared frame renderer ----------

  function renderFrame(hourDecimal, isOverflow, expectancy){
    if(isOverflow){
      timeEl.textContent = '23:59';
      phraseEl.textContent = OVERFLOW_PHRASE;
      ageEl.textContent = formatAge(expectancy);
    } else {
      var hour = Math.floor(hourDecimal);
      var minute = Math.floor((hourDecimal - hour) * 60);
      timeEl.textContent = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
      phraseEl.textContent = phraseFor(hourDecimal);
      ageEl.textContent = formatAge((hourDecimal / 24) * expectancy);
    }
    var effectiveHour = isOverflow ? 23.95 : hourDecimal;
    var sky = skyAt(effectiveHour);
    setSky(sky);
    applyReading(sky.mid);
    applyCelestial(effectiveHour);
    starsEl.style.opacity = starsOpacityFor(sky.zenith).toFixed(3);
  }

  // ---------- reading the current form state ----------

  function currentExpectancy(){
    var e = parseFloat(expectancyInput.value);
    if(!e || e <= 0) e = 80;
    return e;
  }

  function readState(){
    if(!birthInput.value) return { valid: false, future: false };

    var birth = new Date(birthInput.value + 'T00:00:00');
    var now = new Date();
    var diffMs = now - birth;

    if(diffMs < 0) return { valid: false, future: true };

    var age = diffMs / (365.2425 * 24 * 60 * 60 * 1000);
    var ratio = age / currentExpectancy();
    return { valid: true, ratio: ratio };
  }

  function setAdvanceAvailability(available){
    advanceBtn.disabled = !available;
  }

  function update(){
    steppedHour = null;
    var state = readState();

    if(!state.valid){
      showIdle(state.future ? 'Essa data ainda não chegou.' : 'Primeiro, uma data.');
      setAdvanceAvailability(false);
      return;
    }

    var expectancy = currentExpectancy();

    if(state.ratio >= 1){
      renderFrame(null, true, expectancy);
      setAdvanceAvailability(false);
      return;
    }

    renderFrame(state.ratio * 24, false, expectancy);
    setAdvanceAvailability(true);
  }

  // birthdate updates automatically as soon as the whole date (including
  // a full 4-digit year) is present — a native date input's value stays
  // empty until every part is filled, so partial entries never trigger.
  // a short debounce just keeps fast picker scrolling from flickering.
  function clearBirthDebounce(){
    if(birthDebounce){ clearTimeout(birthDebounce); birthDebounce = null; }
  }

  function scheduleUpdate(){
    clearBirthDebounce();
    if(!birthInput.value){
      update();
      return;
    }
    birthDebounce = setTimeout(update, 350);
  }

  function immediateUpdate(){
    clearBirthDebounce();
    update();
  }

  birthInput.addEventListener('input', scheduleUpdate);
  birthInput.addEventListener('change', scheduleUpdate);
  birthInput.addEventListener('blur', immediateUpdate);
  birthInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ immediateUpdate(); birthInput.blur(); }
  });

  expectancyInput.addEventListener('input', update);

  // ---------- advance one hour at a time, from the next round hour ----------

  function advanceHour(){
    var state = readState();
    if(!state.valid) return;

    var expectancy = currentExpectancy();

    if(steppedHour === null){
      steppedHour = Math.floor(state.ratio * 24) + 1;
    } else {
      steppedHour += 1;
    }

    if(steppedHour >= 24){
      renderFrame(null, true, expectancy);
      setAdvanceAvailability(false);
    } else {
      renderFrame(steppedHour, false, expectancy);
    }
  }

  advanceBtn.addEventListener('click', advanceHour);

  update();
})();
</script>

</body>
</html>
